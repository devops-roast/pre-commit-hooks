---
name: pre-commit

permissions:
  id-token: write
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"

jobs:
  pre-commit:
    uses: devops-roast/github-actions/.github/workflows/pre-commit.yaml@fix/mise-github-token
    with:
      auto_commit: true
    secrets: inherit
